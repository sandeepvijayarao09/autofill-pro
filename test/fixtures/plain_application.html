<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Software Engineer</title>
<!-- A plain application form with no scripts, used to screenshot and check the
     real extension filling a page. Labels follow common ATS wording. -->
<style>
  body { font: 15px/1.5 -apple-system, Segoe UI, Helvetica, Arial, sans-serif; background: #f6f7fb; color: #1f2937; margin: 0; }
  main { max-width: 760px; margin: 32px auto; background: #fff; border-radius: 12px; padding: 32px 40px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 4px; } .co { color: #6b7280; margin: 0 0 24px; }
  h2 { font-size: 15px; color: #4f46e5; margin: 24px 0 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
</style></head><body><main>
<h1>Software Engineer, Platform</h1><p class="co">Example Labs · Boston, MA</p>
<h2>Personal information</h2>
<div class="row">
  <div><label for="first_name">First Name</label><input id="first_name" name="first_name"></div>
  <div><label for="last_name">Last Name</label><input id="last_name" name="last_name"></div>
  <div><label for="email">Email</label><input id="email" name="email" type="email"></div>
  <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div><label for="city">City</label><input id="city" name="city"></div>
  <div><label for="state">State</label><input id="state" name="state"></div>
</div>
<h2>Experience</h2>
<div class="row">
  <div><label for="current_company">Current Company</label><input id="current_company" name="current_company"></div>
  <div><label for="current_title">Current Title</label><input id="current_title" name="current_title"></div>
  <div><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin"></div>
  <div><label for="github">GitHub URL</label><input id="github" name="github"></div>
</div>
<h2>Education</h2>
<div class="row">
  <div><label for="school">School</label><input id="school" name="school"></div>
  <div><label for="degree">Degree</label><select id="degree" name="degree"><option value="">Select…</option><option>Associate's</option><option>Bachelor's</option><option>Master's</option><option>PhD</option></select></div>
  <div><label for="discipline">Discipline</label><input id="discipline" name="discipline"></div>
  <div><label for="grad_year">Graduation Year</label><input id="grad_year" name="grad_year"></div>
</div>
</main></body></html>
